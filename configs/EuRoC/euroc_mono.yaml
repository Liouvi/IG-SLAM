inherit_from: configs/EuRoC/base_config.yaml

verbose: False
dataset: 'euroc'
mode: mono
stride: 1
only_tracking: False
vis: True

tracking:
  device: "cuda:0"
  buffer: 512
  beta: 0.75
  warmup: 8
  upsample: True
  motion_filter:
    thresh: 4.0  # add as keyframe if avg flow >= 4.0 pixels
  multiview_filter:
    thresh: 0.01  # dpeth error < 0.01m
    visible_num: 2  # points viewed by at least 2 cameras
    kernel_size: inf
    bound_enlarge_scale: 1.20
  frontend:
    enable_loop: False
    keyframe_thresh: 4.0  # remove keyframe if avg flow < 4.0 pixels
    thresh: 25.0  # only consider edge with avg flow < 16.0 pixels
    window: 16  # local ba window size
    radius: 2
    nms: 1
    max_factors: 100  # num of edges within local ba
  backend:
    # used for loop detection
    loop_window: 50
    loop_nms: 25

cam:  #NOTE: intrinsic is different per scene in TUM
  # refer to https://vision.in.tum.de/data/datasets/rgbd-dataset/file_formats#intrinsic_camera_calibration_of_the_kinect
  H: 480
  W: 752
  fx: 435.2046959714599
  fy: 435.2046959714599
  cx: 367.4517211914062
  cy: 252.2008514404297
  png_depth_scale: 0.0 #for depth image in png format
  ### target/output camera settings, camera_size -> resize -> crop -> target_size
  H_edge: 0
  W_edge: 0
  H_out: 384
  W_out: 512
