inherit_from: configs/Replica/base_config_sp.yaml

verbose: False
dataset: 'replica'
mode: mono
stride: 1
only_tracking: False

mapping:
  device: "cuda:0"
  BA: False
  BA_cam_lr: 0.001

tracking:
  device: "cuda:0"
  start_idx: 0
  buffer: 216
  beta: 0.75
  warmup: 8
  upsample: True
  motion_filter:
    thresh: 4.0  # add as keyframe if avg flow >= 4.0 pixels
  multiview_filter:
    thresh: 0.01  # dpeth error < 0.01m
    visible_num: 2  # points viewed by at least 2 cameras
    kernel_size: inf
    bound_enlarge_scale: 1.20
  frontend:
    enable_loop: False
    keyframe_thresh: 4.0  # remove keyframe if avg flow < 4.0 pixels
    thresh: 25.0  # only consider edge with avg flow < 16.0 pixels
    window: 16  # local ba window size
    radius: 2
    nms: 1
    max_factors: 100  # num of edges within local ba
  backend:
    # used for loop detection
    loop_window: 16
    loop_nms: 25

cam:
  ### original camera parameters
  H: 680
  W: 1200
  fx: 600.0
  fy: 600.0
  cx: 599.5
  cy: 339.5
  png_depth_scale: 6553.5 #for depth image in png format
  ### target/output camera settings, camera_size -> resize -> crop -> target_size
  H_edge: 0
  W_edge: 0
  H_out: 320
  W_out: 640

